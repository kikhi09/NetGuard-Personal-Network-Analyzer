<header class="topbar">
  <div class="topbar__title">
    <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <h1>{{ page_title }}</h1>
  </div>
  <div class="topbar__summary">
    <span class="status-badge status-badge--unknown" id="top-capture-status">Checking</span>
    <span class="topbar__metric"><small>Capture</small><strong>Current Session</strong></span>
    <span class="topbar__metric"><small>Safety Score</small><strong id="top-safety-score">—</strong></span>
    <span class="topbar__clock" id="top-clock">—</span>
  </div>
</header>
