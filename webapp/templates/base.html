<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="netguard-csrf-token" content="{{ csrf_token }}">
  <title>{{ page_title }} · NetGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body data-page="{{ active_page }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    {% include "_sidebar.html" %}
    <button class="drawer-scrim" id="drawer-scrim" aria-label="Close navigation"></button>
    <div class="app-workspace">
      {% include "_topbar.html" %}
      <div class="api-banner" id="api-banner" role="status" aria-live="polite" hidden>
        The local API is temporarily unavailable. Displayed information may be stale.
      </div>
      <main class="main-content" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="details-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <div>
          <p class="eyebrow">Alert details</p>
          <h2 id="modal-title">Unusual Network Activity</h2>
        </div>
        <button class="icon-button" id="modal-close" type="button" aria-label="Close details dialog">×</button>
      </div>
      <div class="modal__body" id="modal-body"></div>
    </section>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/shell.js') }}"></script>
  {% if page_script %}
  <script type="module" src="{{ url_for('static', filename='js/' + page_script) }}"></script>
  {% endif %}
</body>
</html>
